<!DOCTYPE html>
<html>
<head>
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title data-i18n="TITLE">NDS스튜디오 스케치업 웹툰배경 생성기</title>
    <link rel="stylesheet" href="css/NDS_WIC.css" type="text/css" />
</head>
<body>
    <div class="header-banner">
        <img src="img/menu.png" alt="NDS Banner" class="banner-img" />
    </div>

    <form name="channels" class="main-form">
        <div class="container-row">

            <!-- 좌측 패널 (채널 순서 재배치) -->
            <div class="card-panel left-card">
                <table class="grid-table" border="0" cellspacing="6">
                    <tr>
                        <td><label><input type="checkbox" id="line" checked> <span data-i18n="CH_LINE">실선</span></label></td>
                        <td><label><input type="checkbox" id="profile" checked> <span data-i18n="CH_PROFILE">두꺼운선</span></label></td>
                    </tr>
                    <tr>
                        <td><label><input type="checkbox" id="vibration"> <span data-i18n="CH_VIBRATION">진동</span></label></td>
                        <td><label><input type="checkbox" id="color" checked> <span data-i18n="CH_COLOR">기본색</span></label></td>
                    </tr>
                    <tr>
                        <td><label><input type="checkbox" id="shadow" checked> <span data-i18n="CH_SHADOW">명암</span></label></td>
                        <td><label><input type="checkbox" id="cley"> <span data-i18n="CH_CLEY">클레이</span></label></td>
                    </tr>
                    <tr>
                        <td><label><input type="checkbox" id="texture" checked> <span data-i18n="CH_TEXTURE">텍스쳐</span></label></td>
                        <td><label><input type="checkbox" id="colorbylayer"> <span data-i18n="CH_COLORBYLAYER">컬러레이어</span></label></td>
                    </tr>
                    <tr>
                        <td><label><input type="checkbox" id="alpha"> <span data-i18n="CH_ALPHA">알파</span></label></td>
                        <td><label><input type="checkbox" id="zdepth"> <span data-i18n="CH_ZDEPTH">Z뎁스</span></label></td>
                    </tr>
                </table>
                <p class="notice-text" data-i18n="NOTICE_SELECT">장면 체크 후에 생성 버튼 누르세요</p>
            </div>

            <!-- 우측 패널 (내보내기 옵션) -->
            <div class="card-panel right-card">
                <table class="option-table" border="0" cellspacing="6">
                    <tr>
                        <td align="right" colspan="2" style="text-align: center;">
                            <label><input type="radio" name="type" value="all" checked> <span data-i18n="OPT_ALL_SCENES">모든장면</span></label>&nbsp;&nbsp;
                            <label><input type="radio" name="type" value="single"> <span data-i18n="OPT_SINGLE_SCENE">현재장면</span></label>
                        </td>
                    </tr>
                    <tr>
                        <td align="right"><small data-i18n="OPT_FILE_TYPE">파일타입</small></td>
                        <td>
                            <select id="seltype" class="round-select">
                                <option value="psd" selected>PSD</option>
                                <option value="png">PNG</option>
                                <option value="jpg">JPG</option>
                                <option value="bmp">BMP</option>
                                <option value="tiff">TIFF</option>
                            </select>
                        </td>
                    </tr>
                    <tr>
                        <td align="right"><small>Width</small></td>
                        <td><input type="text" id="widthTxt" value="4000" class="round-input" /></td>
                    </tr>
                    <tr>
                        <td align="right"><small>Height</small></td>
                        <td><input type="text" id="heightTxt" value="2500" class="round-input" /></td>
                    </tr>
                    <tr>
                        <td align="right"><small>Antialias</small></td>
                        <td><input type="checkbox" id="antialias" checked class="round-checkbox"></td>
                    </tr>
                    <tr>
                        <td align="right"><small>Transparent</small></td>
                        <td><input type="checkbox" id="transparent" checked class="round-checkbox"></td>
                    </tr>
                </table>
            </div>

        </div>

        <!-- 하단 버튼 -->
        <div class="container-buttons">
            <div class="btn-box left-btn-box">
                <button type="button" id="btnCreate" class="action-btn create-btn" onclick="sendCreate()" data-i18n="BTN_CREATE">장면생성</button>
            </div>
            <div class="btn-box right-btn-box">
                <button type="button" id="btnExport" class="action-btn export-btn" onclick="sendExport()" data-i18n="BTN_EXPORT">웹툰 내보내기</button>
            </div>
        </div>
<br>
        <!-- 프로그레스 바 -->
        <div id="progressContainer" class="progress-container" style="display: none; margin-top: 24px; margin-bottom: 12px;">
            <div class="progress-info">
                <span id="progressMsg" data-i18n="PROG_PREPARING">준비 중...</span>
                <span id="progressPercent">0%</span>
            </div>
            <div class="progress-track">
                <div id="progressBar" class="progress-bar-fill" style="width: 0%;"></div>
            </div>
        </div>

        <!-- 하단 버전 표시 v2.1.1 -->
        <div class="footer-bar">
            <span>NDS-WIC v2.1.1 &copy; NDS Studio</span>
        </div>
    </form>

    <script>
        var isWorking = false;

        function applyTranslations(dict) {
            if (!dict) return;
            var elements = document.querySelectorAll('[data-i18n]');
            for (var i = 0; i < elements.length; i++) {
                var el = elements[i];
                var key = el.getAttribute('data-i18n');
                if (dict[key]) {
                    if (el.tagName.toLowerCase() === 'input' && (el.type === 'button' || el.type === 'submit')) {
                        el.value = dict[key];
                    } else {
                        el.innerHTML = dict[key];
                    }
                }
            }
        }

        function callRuby(url) {
            var iframe = document.getElementById('skp_bridge');
            if (!iframe) {
                iframe = document.createElement('iframe');
                iframe.id = 'skp_bridge';
                iframe.style.display = 'none';
                document.body.appendChild(iframe);
            }
            iframe.src = url;
        }

        window.onload = function () {
            callRuby('skp:push_frame@action=init_lang');
        };

        function setButtonsDisabled(disabled) {
            document.getElementById('btnCreate').disabled = disabled;
            document.getElementById('btnExport').disabled = disabled;
        }

        function getCheckedRadioValue(radioGroupName) {
            var rads = document.getElementsByName(radioGroupName);
            for (var i = 0; i < rads.length; i++) {
                if (rads[i].checked) return rads[i].value;
            }
            return "all";
        }

        function updateProgress(percent, msg) {
            var container = document.getElementById('progressContainer');
            var bar = document.getElementById('progressBar');
            var percentTxt = document.getElementById('progressPercent');
            var msgTxt = document.getElementById('progressMsg');

            container.style.display = 'block';
            var p = Math.min(100, Math.max(0, parseInt(percent) || 0));
            bar.style.width = p + '%';
            percentTxt.innerHTML = p + '%';
            if (msg) msgTxt.innerHTML = msg;

            if (p >= 100) {
                setTimeout(function () {
                    container.style.display = 'none';
                    bar.style.width = '0%';
                    isWorking = false;
                    setButtonsDisabled(false);
                }, 3000);
            }
        }

        function sendCreate() {
            if (isWorking) return;
            isWorking = true;
            setButtonsDisabled(true);

            var url = 'skp:push_frame@action=create';
            url += '&alpha=' + document.getElementById('alpha').checked;
            url += '&cley=' + document.getElementById('cley').checked;
            url += '&color=' + document.getElementById('color').checked;
            url += '&colorbylayer=' + document.getElementById('colorbylayer').checked;
            url += '&line=' + document.getElementById('line').checked;
            url += '&profile=' + document.getElementById('profile').checked;
            url += '&shadow=' + document.getElementById('shadow').checked;
            url += '&texture=' + document.getElementById('texture').checked;
            url += '&zdepth=' + document.getElementById('zdepth').checked;
            url += '&vibration=' + document.getElementById('vibration').checked;

            callRuby(url);

            setTimeout(function () {
                if (isWorking) {
                    isWorking = false;
                    setButtonsDisabled(false);
                }
            }, 2000);
        }

        function sendExport() {
            if (isWorking) return;
            isWorking = true;
            setButtonsDisabled(true);

            var all_single = getCheckedRadioValue("type");
            var seltype = document.getElementById("seltype");
            var sel_type = seltype.options[seltype.selectedIndex].value;
            var getwidth = document.getElementById('widthTxt').value;
            var getheight = document.getElementById('heightTxt').value;
            var antialias = document.getElementById('antialias').checked;
            var transparent = document.getElementById('transparent').checked;

            var url = 'skp:push_frame@action=export';
            url += '&all_single=' + all_single;
            url += '&sel_type=' + sel_type;
            url += '&getwidth=' + getwidth;
            url += '&getheight=' + getheight;
            url += '&antialias=' + antialias;
            url += '&transparent=' + transparent;

            callRuby(url);
        }
    </script>
</body>
</html>
